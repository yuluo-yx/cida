# Validate macOS packages on every PR; publish only on an explicit dispatch.
name: Build and Release macOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v1.6.0 (requires matching update notes)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate the release version and target
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          version=1.6.0
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$GITHUB_REF" != refs/heads/main || ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::Dispatch a vX.Y.Z release from main."
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
            if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              if [[ "$(git rev-list -n 1 "$RELEASE_TAG")" != "$GITHUB_SHA" ]]; then
                echo "::error::The existing release tag points to another commit."
                exit 1
              fi
            fi
          fi
          python3 scripts/ci/release-notes.py "$version"
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Build with warnings as errors
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test
      - name: Build the website
        run: python3 scripts/build-website.py

  macos:
    name: macOS arm64
    needs: validate
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build and package
        env:
          CIDA_VERSION: ${{ needs.validate.outputs.version }}
        run: scripts/package-macos-release.sh
      - name: Upload macOS packages
        uses: actions/upload-artifact@v7
        with:
          name: Cida-macos-arm64
          path: build/releases/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@v8
        with:
          name: Cida-macos-arm64
          path: release-assets
      - name: Validate packages and write checksums
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          cd release-assets
          for extension in dmg zip; do
            test -s "Cida-$VERSION-macos-arm64.$extension"
          done
          sha256sum Cida-*.dmg Cida-*.zip >"Cida-$VERSION-SHA256SUMS.txt"
      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          cp "docs/releases/$VERSION.md" "$RUNNER_TEMP/release-notes.md"
          cat >>"$RUNNER_TEMP/release-notes.md" <<'NOTES'

          Requires Apple Silicon (arm64) and macOS 15 or later.
          These packages use ad hoc signatures and are not Apple-notarized.
          Automatic updates from the upstream Sparkle feed are disabled; install future releases from this repository.
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --title "Cida $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          else
            gh release create "$RELEASE_TAG" release-assets/* --target "$GITHUB_SHA" \
              --title "Cida $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi
